<div class="min-h-screen flex items-center justify-center bg-[#F9F5F0] p-4" style="background-image: radial-gradient(circle at 10% 30%, rgba(185,141,141,0.06) 0%, transparent 50%), radial-gradient(circle at 90% 70%, rgba(141,163,153,0.05) 0%, transparent 50%);">
  <div class="w-full max-w-[520px] card" style="padding: 40px;">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-[#8C6767] mb-4">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <h1 style="font-family: 'Noto Serif', serif; font-size: 26px; font-weight: 500; color: #121212; margin: 0;">Recuperación de Cuenta</h1>
      <p style="font-size: 14px; color: #9B928B; margin-top: 4px;">Complete los datos para recuperar su cuenta</p>
    </div>

    <div *ngIf="errorMessage" class="msg-error">{{ errorMessage }}</div>
    <div *ngIf="successMessage" class="msg-success">{{ successMessage }}</div>

    <form class="space-y-4">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="label">Nombre</label>
          <input type="text" class="input" [(ngModel)]="formData.name" name="name" placeholder="Ingresa tu nombre">
        </div>
        <div>
          <label class="label">Apellido</label>
          <input type="text" class="input" [(ngModel)]="formData.lastName" name="lastName" placeholder="Ingresa tu apellido">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="label">Usuario</label>
          <input type="text" class="input" [(ngModel)]="formData.username" name="username" placeholder="Nombre de usuario">
        </div>
        <div>
          <label class="label">Correo Electrónico</label>
          <input
            type="email"
            class="input"
            [(ngModel)]="formData.email"
            name="email"
            placeholder="ejemplo@correo.com"
            required
            email
            #emailInput="ngModel"
          >
          <span *ngIf="emailInput.invalid && (emailInput.dirty || emailInput.touched)" class="text-[#9A5E5E] text-[12px] mt-1 block font-medium">
            <small *ngIf="emailInput.errors?.['required']">El correo es obligatorio.</small>
            <small *ngIf="emailInput.errors?.['email']">Ingresa un formato de correo válido.</small>
          </span>
        </div>
      </div>

      <div class="flex gap-3 pt-2">
        <button type="button" class="btn-primary flex-1" [disabled]="loading" (click)="saveRequest()">
          <div *ngIf="loading" class="loading-spinner" style="padding: 0;">Enviando...</div>
          <span *ngIf="!loading">Enviar Solicitud</span>
        </button>
        <button type="button" class="btn-outline" (click)="goToLogin()">Volver</button>
      </div>
    </form>
  </div>
</div>

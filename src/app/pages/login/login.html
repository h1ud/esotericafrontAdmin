
<div class="login-page">
  <!-- ============ Panel decorativo izquierdo ============ -->
  <aside class="login-decor" aria-hidden="true">
    <div class="decor-stars decor-stars--small"></div>
    <div class="decor-stars decor-stars--medium"></div>
    <div class="decor-stars decor-stars--large"></div>

    <!-- Constelación SVG -->
    <svg class="decor-constellation" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
      <g stroke="rgba(255,255,255,0.35)" stroke-width="0.6" fill="none">
        <line x1="60"  y1="80"  x2="130" y2="40" />
        <line x1="130" y1="40"  x2="200" y2="90" />
        <line x1="200" y1="90"  x2="260" y2="50" />
        <line x1="200" y1="90"  x2="170" y2="170" />
        <line x1="170" y1="170" x2="90"  y2="200" />
        <line x1="90"  y1="200" x2="60"  y2="80"  />
      </g>
      <g fill="#F3E2E2">
        <circle cx="60"  cy="80"  r="2.2" />
        <circle cx="130" cy="40"  r="2.6" />
        <circle cx="200" cy="90"  r="3" />
        <circle cx="260" cy="50"  r="2" />
        <circle cx="170" cy="170" r="2.4" />
        <circle cx="90"  cy="200" r="2" />
      </g>
    </svg>

    <!-- Luna creciente SVG -->
    <svg class="decor-moon" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%"  stop-color="rgba(243,226,226,0.45)" />
          <stop offset="70%" stop-color="rgba(243,226,226,0.05)" />
          <stop offset="100%" stop-color="rgba(243,226,226,0)" />
        </radialGradient>
      </defs>
      <circle cx="100" cy="100" r="90" fill="url(#moonGlow)" />
      <path d="M120,40 a60,60 0 1,0 0,120 a45,45 0 1,1 0,-120 z"
            fill="#F3E2E2" opacity="0.9"/>
    </svg>

    <div class="decor-content">
      <span class="decor-eyebrow">Panel Administrativo</span>
      <h1 class="decor-title">Esoterica</h1>
      <p class="decor-tagline">
        Un espacio para administrar con calma, claridad y precisión.
      </p>
    </div>
  </aside>

  <!-- ============ Panel derecho con formulario ============ -->
  <main class="login-form-area">
    <div class="login-card">
      <header class="login-header">
        <h2>Bienvenida de vuelta</h2>
        <p>Ingresa tus credenciales para continuar.</p>
      </header>

      <div *ngIf="errorMessage" class="error-message" role="alert">
        <span class="error-dot"></span>
        {{ errorMessage }}
      </div>

      <form class="login-form" (ngSubmit)="onLogin()" novalidate>
        <div class="form-group">
          <label for="username">Usuario</label>
          <input
            id="username"
            type="text"
            name="username"
            autocomplete="username"
            placeholder="Ingresa tu usuario"
            [(ngModel)]="loginData.username"
          >
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            id="password"
            type="password"
            name="password"
            autocomplete="current-password"
            placeholder="Ingresa tu contraseña"
            [(ngModel)]="loginData.password"
          >
        </div>

        <button type="submit" class="btn-login">Iniciar sesión</button>

        <div class="login-footer">
          <a routerLink="/passwordReset">Restablecer contraseña</a>
        </div>
      </form>
    </div>
  </main>
</div>

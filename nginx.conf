# ===============================================================
#   ESOTÉRICA · Nginx Config
#   Sirve el SPA de Angular y redirige /api/* al backend
# ===============================================================

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Angular SPA — fallback a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso hacia el backend Spring Boot
    # En Docker: usa host.docker.internal para acceder al host (donde está el backend)
    location /api/ {
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS local (no necesario si el backend ya tiene @CrossOrigin)
        # pero se deja por si acaso
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Cache de assets estáticos
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        expires 6M;
        add_header Cache-Control "public, immutable";
    }
}
